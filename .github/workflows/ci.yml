name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: node --experimental-strip-types supabase/functions/process-link/fetch-caption.test.ts
      - run: node --experimental-strip-types supabase/functions/process-link/benchmark.test.ts
      # Same Metro bundle step EAS runs ("Bundle JavaScript"), so a missing
      # native-only dependency fails here instead of in a cloud build.
      - run: npx expo export --platform ios --platform android --output-dir /tmp/native-export
