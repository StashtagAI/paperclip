name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: node --experimental-strip-types supabase/functions/process-link/fetch-caption.test.ts
      - run: node --experimental-strip-types supabase/functions/process-link/benchmark.test.ts
      - run: node --experimental-strip-types supabase/functions/process-link/test.ts
      # HAN-46: other users' link_id and prompt-injection fixtures against the process-link handler.
      - run: node --experimental-strip-types supabase/functions/process-link/security.test.ts
      - run: node --experimental-strip-types supabase/functions/process-link/source-cache.test.ts
      # HAN-83: Google rating and hours for Eats items.
      - run: node --experimental-strip-types supabase/functions/place-details/test.ts
      # HAN-100: landing waitlist function (validation, honeypot, dedupe reply, origin check).
      - run: node --experimental-strip-types supabase/functions/waitlist/test.ts
      # HAN-112: Apple client secret, token checks for apple-token, and revoking on account deletion.
      - run: node --experimental-strip-types supabase/functions/apple-token/test.ts
      # HAN-96/HAN-100: landing site builds and passes its checks (FAQ/JSON-LD, store links, waitlist form and CSP).
      - run: npm run check
        working-directory: landing
      # Same Metro bundle step EAS runs ("Bundle JavaScript"), so a missing
      # native-only dependency fails here instead of in a cloud build.
      - run: npx expo export --platform ios --platform android --output-dir /tmp/native-export
      # Web build as Expo Hosting deploys it: the security headers must be in _expo/.routes.json and the CSP must
      # allow every inline script the static export writes (HAN-39).
      - run: npx expo export --platform web --output-dir /tmp/web-export
      - run: node scripts/check-web-headers.mjs /tmp/web-export

  # HAN-46: apply every migration to an empty Supabase Postgres and run the RLS tests (supabase/tests/database).
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.11.0.011
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # Two migrations with the same version clash in Supabase's history, and one is skipped.
      - run: |
          dupes=$(ls supabase/migrations | cut -c1-14 | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Duplicate migration versions: $dupes"; exit 1; fi
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  # HAN-39: secret and dependency scanning.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Known advisories across the whole lockfile. High and critical fail the build; moderate ones are mostly in
      # Expo's build tooling and wait for SDK upgrades.
      - name: npm audit
        run: npm audit --audit-level=high
      # dependency-review-action errors out while the repo's Dependency graph setting is off. Skip it with a warning
      # until a repo admin turns that on; from then on it runs and blocks without another change here.
      - name: Check Dependency graph is enabled
        id: depgraph
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is off for this repo, so dependency review was skipped. Enable it in Settings > Code security."
          fi
      - name: Dependency review (new or changed dependencies in this PR)
        if: github.event_name == 'pull_request' && steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
