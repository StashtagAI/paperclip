name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: node --experimental-strip-types supabase/functions/process-link/fetch-caption.test.ts
      # Same Metro bundle step EAS runs ("Bundle JavaScript"), so a missing
      # native-only dependency fails here instead of in a cloud build.
      - run: npx expo export --platform ios --platform android --output-dir /tmp/native-export
      # Web build as Expo Hosting deploys it: the security headers must be in _expo/.routes.json and the CSP must
      # allow every inline script the static export writes (HAN-39).
      - run: npx expo export --platform web --output-dir /tmp/web-export
      - run: node scripts/check-web-headers.mjs /tmp/web-export

  # HAN-39: secret and dependency scanning.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Known advisories across the whole lockfile. High and critical fail the build; moderate ones are mostly in
      # Expo's build tooling and wait for SDK upgrades.
      - name: npm audit
        run: npm audit --audit-level=high
      # dependency-review-action errors out while the repo's Dependency graph setting is off. Skip it with a warning
      # until a repo admin turns that on; from then on it runs and blocks without another change here.
      - name: Check Dependency graph is enabled
        id: depgraph
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is off for this repo, so dependency review was skipped. Enable it in Settings > Code security."
          fi
      - name: Dependency review (new or changed dependencies in this PR)
        if: github.event_name == 'pull_request' && steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
