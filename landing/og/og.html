<!doctype html>
<!-- Source for public/assets/og.png (1200×630). Re-render with the command in ../README.md. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
        box-sizing: border-box;
        background: #f4f9ff;
        color: #0b1b2b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .copy {
        flex: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
      }
      .tagline {
        margin: 28px 0 32px;
        font-size: 44px;
        font-weight: 700;
        line-height: 1.15;
      }
      .crumb {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 999px;
        background: #19c48d;
        color: #0b1b2b;
        font-size: 30px;
        font-weight: 700;
      }
      .sub {
        margin-top: 28px;
        font-size: 28px;
        color: #52627a;
      }
      .shot {
        width: 280px;
        height: 607px;
        margin-top: 120px;
        border-radius: 32px;
        border: 1px solid #d5e3f5;
        box-shadow: 0 24px 48px -16px rgb(11 27 43 / 35%);
        object-fit: cover;
        object-position: top;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../public/assets/icon-192.png" alt="">StashtagAI</div>
      <p class="tagline">Save Instagram and TikTok posts.<br>Get organized lists.</p>
      <span class="crumb">Eats › Restaurants › Denver</span>
      <p class="sub">Free on iPhone and Android</p>
    </div>
    <img class="shot" src="../public/assets/home-light.webp" alt="">
  </body>
</html>
